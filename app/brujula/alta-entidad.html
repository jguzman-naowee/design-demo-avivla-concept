<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de entidad · Brújula Ciudadana</title>
<link rel="icon" type="image/svg+xml" href="../../shared/img/marca-brujula.svg">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_sdk/css/styles.css">
<link rel="stylesheet" href="_sdk/css/fuentes.css">
<link rel="stylesheet" href="_sdk/css/icons.min.css">
<link rel="stylesheet" href="_sdk/css/components.min.css">
<link rel="stylesheet" href="app.css">
<style>
/* Panel oscuro con los pasos a la izquierda y el formulario a la derecha; en móvil el panel pasa arriba. */
.ae-shell{display:flex;flex-wrap:wrap;min-height:100vh}
.ae-panel{position:sticky;top:0;align-self:flex-start;height:100vh;overflow:hidden;flex:1 1 340px;max-width:460px;display:flex;flex-direction:column;gap:36px;padding:40px;background:var(--bc-dark);color:#fff}
.ae-panel > *{position:relative}
.ae-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.ae-brand .nwt-icon{font-size:24px;color:#FF9A5C}
.ae-deco{position:absolute!important;right:-150px;bottom:-110px;pointer-events:none}
.ae-panel h1{font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.03em;min-height:0}
.ae-panel h1 span{color:#FF9A5C}
.ae-pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ae-pasos li{display:flex;align-items:center;gap:14px;min-height:52px;font-size:15px;font-weight:500;color:#C9CBD6}
.ae-pasos i{width:32px;height:32px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;background:#2B2D45;color:#C9CBD6}
.ae-pasos li.hecho i{color:#9BE7BE}
.ae-pasos li.ahora{font-weight:700;color:#fff}
.ae-pasos li.ahora i{background:#FF9A5C;color:var(--bc-dark)}
.ae-salir{margin-top:auto;font-size:13px;color:#C9CBD6;text-decoration:none}
.ae-main{flex:999 1 520px;min-width:0;max-width:820px;display:flex;flex-direction:column;gap:20px;padding:48px clamp(20px,5vw,72px) 64px}
.ae-sec{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:24px;background:var(--bc-surface)}
.ae-sec h2{font-size:20px;font-weight:700;letter-spacing:-.01em;min-height:0}
.ae-chk{display:flex;flex-wrap:wrap;gap:8px}
.ae-chip{position:relative;display:inline-flex}
.ae-chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ae-chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--bc-inset);color:#3E4157;font-size:14px;font-weight:500}
.ae-chip input:checked + span{background:var(--bc-ink);color:#fff;font-weight:600}
.ae-chip input:focus-visible + span{outline:3px solid var(--bc-acc);outline-offset:2px}
.ae-acepto{display:flex;gap:12px;align-items:center;min-height:44px;font-size:14px;color:#3E4157;cursor:pointer}
.ae-acepto input{width:24px;height:24px;flex:none;accent-color:var(--bc-acc)}
.ae-rec{display:grid;grid-template-columns:1.4fr 1.2fr .8fr auto;gap:12px;align-items:end;padding:16px;border-radius:20px;background:var(--bc-inset)}
.ae-rec > :first-child{grid-column:1/-1}
.ae-lista{display:flex;flex-direction:column;gap:12px}
.ae-add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:2px dashed #C9CBD6;border-radius:24px;background:transparent;color:#4A4D63;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ae-add .nwt-icon{font-size:20px}
.ae-pie{display:flex;justify-content:flex-end;padding-top:4px}
.ae-pie .nwt-button{min-height:52px}
.ae-hecho .bc-item .t{font-weight:600}
@media (max-width:820px){
  .ae-panel{position:relative;height:auto;flex:1 1 100%;max-width:none;gap:20px;padding:24px 20px}
  .ae-panel h1{font-size:28px}
  .ae-deco{display:none}
  .ae-pasos{flex-direction:row;gap:12px}
  .ae-pasos li{flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:6px;min-height:0;font-size:13px}
  .ae-salir{margin-top:0}
  .ae-main{padding:20px 16px 48px}
  .ae-sec{padding:18px 16px}
  .ae-rec{grid-template-columns:1fr 1fr}.ae-rec > :first-child{grid-column:1/-1}
  .ae-pie .nwt-button{width:100%}
}
</style>
</head>
<body>
<div class="ae-shell">
<aside class="ae-panel">
  <span class="ae-brand"><img src="../../shared/img/marca-brujula.svg" width="40" height="40" alt=""><img src="../../shared/img/palabra-brujula-oscuro.svg" height="44" alt="Brújula Ciudadana"></span>
  <svg class="ae-deco" width="360" height="360" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="140" fill="none" stroke="#2B2D45" stroke-width="1.5"/><circle cx="150" cy="150" r="96" fill="none" stroke="#2B2D45" stroke-width="1.5"/><circle cx="150" cy="150" r="52" fill="none" stroke="#33354F" stroke-width="1.5"/><circle cx="150" cy="150" r="7" fill="#FF9A5C"/></svg>
  <h1>Suma tu entidad<br><span>a la red</span></h1>
  <ol class="ae-pasos" id="pasos" aria-label="Pasos del registro"></ol>
  <a class="ae-salir" href="../../index.html" target="_top">Salir de la demo</a>
</aside>
<main class="ae-main">
  <div id="formWrap" class="stack bc-entra">
    <div><button type="button" class="nwt-button" nwt-variant="quiet" nwt-size="small" id="ejemplo"><span class="nwt-button__content"><div class="nwt-icon nwt-button__icon"><i class="naotech-icon-sparkles"></i></div>Completar con datos de ejemplo</span></button></div>
    <form id="form" novalidate class="stack"></form>
    <div id="error"></div>
    <div class="ae-pie"><button type="submit" form="form" class="nwt-button" nwt-variant="loud" nwt-size="medium" id="enviar"><span class="nwt-button__content">Registrar entidad<div class="nwt-icon nwt-button__icon"><i class="naotech-icon-arrow-right"></i></div></span></button></div>
  </div>
  <div id="ok" hidden class="stack ae-hecho">
    <div class="nwt-alert nwt-alert--visible" nwt-theme="positive" nwt-variant="quiet"><div class="nwt-alert__content"><span class="nwt-alert__label"><b>Registro recibido.</b> Pendiente de verificar el correo.</span></div></div>
    <section class="ae-sec"><p>Enviamos un correo a <b id="okEmail"></b> para confirmar la entidad.</p></section>
    <section class="ae-sec"><h2>Recursos registrados</h2><div id="okRecs"></div></section>
    <div><button type="button" class="nwt-button" nwt-variant="quiet" nwt-size="medium" id="otra"><span class="nwt-button__content">Registrar otra entidad</span></button></div>
  </div>
</main>
</div>
<script>
(() => {
  "use strict";
  const AREAS = ["Vivienda", "Ingresos", "Alimentación", "Salud y Bienestar", "Documentación y Trámites", "Red de Apoyo", "Familia", "Infancia y Menores", "Mujer y Cuidados", "Empleo", "Formación", "Movilidad", "Competencias Digitales", "Autonomía Personal y Cuidados", "Organización y Dirección", "Participación y Comunidad"];
  const TIPOS = ["ONG", "Fundación", "Asociación", "Servicio social", "Administración pública", "Otra"];
  const $ = (id) => document.getElementById(id), form = $("form");
  const box = (inner, id, label, req) => '<div class="nwt-input-box" data-box="' + id + '"><div class="nwt-input-box__content"><label class="nwt-input-box__label" for="' + id + '">' + label + (req ? "" : " (opcional)") + '</label><div class="nwt-input-box__control">' + inner + "</div></div></div>";
  const txt = (id, label, req, type, ph) => '<div class="nwt-text-field" nwt-size="medium">' + box('<input id="' + id + '" name="' + id + '" class="nwt-text-field__input" type="' + (type || "text") + '"' + (req ? " required" : "") + (ph ? ' placeholder="' + ph + '"' : "") + ">", id, label, req) + "</div>";
  const sel = (id, label, opts) => '<div class="nwt-select" nwt-size="medium">' + box('<div class="nwt-select__content"><select id="' + id + '" name="' + id + '" class="nwt-select__input" required><option value="">Selecciona…</option>' + opts.map((o) => "<option>" + o + "</option>").join("") + '</select><div class="nwt-select__chevron" aria-hidden="true"><div class="nwt-icon"><i class="naotech-icon-chevron-down"></i></div></div></div>', id, label, true) + "</div>";
  const sec = (id, t, h) => '<section class="ae-sec" id="sec-' + id + '"><h2>' + t + "</h2>" + h + "</section>";
  form.innerHTML =
    sec("entidad", "Tu entidad", '<div class="grid2">' + txt("nombre", "Nombre de la organización", true) + sel("tipo", "Tipo de organización", TIPOS) + txt("cif", "CIF", false) + txt("municipio", "Municipio", true) + txt("cp", "Código postal", true, "text", "28000") + txt("cobertura", "Área de cobertura", true, "text", "Distritos o municipios") + "</div>" +
      '<div class="ae-chk" id="areas" role="group" aria-label="Áreas de intervención">' + AREAS.map((a, i) => '<label class="ae-chip"><input type="checkbox" name="areas" value="' + a + '" id="area-' + i + '"><span>' + a + "</span></label>").join("") + "</div>") +
    sec("contacto", "Contacto", '<div class="grid2">' + txt("contacto", "Nombre y apellidos", true) + txt("cargo", "Cargo", false) + txt("email", "Correo institucional", true, "email") + txt("tel", "Teléfono", false, "tel") + "</div>") +
    sec("recursos", "¿Qué ofrecéis?", '<div class="ae-lista" id="recs"></div><button type="button" class="ae-add" id="addRec"><div class="nwt-icon"><i class="naotech-icon-plus"></i></div>Añadir recurso</button>' +
      '<label class="ae-acepto"><input type="checkbox" id="acepto" name="acepto" required>Acepto las condiciones de la red</label>');

  /* Filas de recursos: mismo marcado que el resto de campos, con ids únicos por fila. */
  let nRec = 0;
  const filaRec = () => { const i = nRec++, d = document.createElement("div"); d.className = "ae-rec"; d.dataset.rec = i;
    d.innerHTML = txt("rec" + i + "-nombre", "Nombre del recurso", true) + sel("rec" + i + "-cat", "Necesidad que atiende", AREAS) + sel("rec" + i + "-modo", "Cómo se accede", ["Libre", "Inscripción", "Solicitud"]) + txt("rec" + i + "-cupo", "Plazas", false, "text") +
      '<button type="button" class="nwt-button" nwt-variant="mute" nwt-size="small" data-quitar aria-label="Quitar recurso"><span class="nwt-button__content"><div class="nwt-icon nwt-button__icon"><i class="naotech-icon-trash"></i></div></span></button>';
    $("recs").appendChild(d); return d; };
  const filas = () => [...$("recs").children];
  filaRec();
  $("addRec").addEventListener("click", () => { filaRec().querySelector("input").focus(); pasos(); });
  $("recs").addEventListener("click", (e) => { const b = e.target.closest("[data-quitar]"); if (b) { b.closest(".ae-rec").remove(); pasos(); } });
  const EJ_RECS = [{ nombre: "Clases de español para adultos", cat: "Formación", modo: "Inscripción", cupo: "20" }, { nombre: "Acompañamiento en la búsqueda de vivienda", cat: "Vivienda", modo: "Solicitud", cupo: "8" }];
  const recsDe = () => filas().map((f) => { const g = (k) => f.querySelector('[id$="-' + k + '"]').value.trim(); return { nombre: g("nombre"), cat: g("cat"), modo: g("modo"), cupo: g("cupo") }; });
  const EJ = { nombre: "Asociación Horizonte Común", tipo: "Asociación", cif: "G12345678", municipio: "Madrid", cp: "28045", cobertura: "Arganzuela y Usera", contacto: "Rosa Martín Calvo", cargo: "Coordinadora", email: "coordinacion@horizontecomun.org", tel: "+34 910 000 000" };
  const limpiar = () => { $("error").innerHTML = ""; form.querySelectorAll(".nwt-input-box--error").forEach((b) => b.classList.remove("nwt-input-box--error")); };

  /* Pasos del panel: se marcan solos cuando su sección está completa. */
  const bien = (el) => !!el.value.trim() && el.checkValidity() && !(el.id === "cp" && !/^\d{5}$/.test(el.value));
  const ok = (ids) => ids.every((k) => bien(form.elements[k]));
  const hechos = () => [
    ok(["nombre", "tipo", "municipio", "cp", "cobertura"]) && !!form.querySelector('[name="areas"]:checked'),
    ok(["contacto", "email"]),
    filas().length > 0 && filas().every((f) => [...f.querySelectorAll("[required]")].every(bien)) && $("acepto").checked
  ];
  const NOMBRES = ["Tu entidad", "Contacto", "Recursos"];
  function pasos(todos) {
    const h = todos ? [true, true, true] : hechos(), ahora = h.indexOf(false);
    $("pasos").innerHTML = NOMBRES.map((t, i) => '<li class="' + (h[i] ? "hecho" : i === ahora ? "ahora" : "") + '"' + (i === ahora ? ' aria-current="step"' : "") + "><i>" + (h[i] ? "✓" : i + 1) + "</i><span>" + t + (h[i] ? '<span class="sr"> completado</span>' : "") + "</span></li>").join("");
  }
  form.addEventListener("input", () => pasos()); form.addEventListener("change", () => pasos());
  pasos();

  let fallo = false;
  /* Solo llena lo vacío o inválido: respeta lo que ya se escribió. */
  const rellenar = () => {
    limpiar();
    Object.entries(EJ).forEach(([k, v]) => { const el = form.elements[k]; if (!el.value.trim() || !el.checkValidity() || (k === "cp" && !/^\d{5}$/.test(el.value))) el.value = v; });
    if (!form.querySelector('[name="areas"]:checked')) ["Vivienda", "Empleo", "Formación"].forEach((a) => { form.querySelector('[value="' + a + '"]').checked = true; });
    $("acepto").checked = true;
    while (filas().length < EJ_RECS.length) filaRec();
    filas().forEach((f, i) => { const ej = EJ_RECS[i % EJ_RECS.length]; ["nombre", "cat", "modo", "cupo"].forEach((k) => { const el = f.querySelector('[id$="-' + k + '"]'); if (!el.value.trim()) el.value = ej[k]; }); });
    pasos();
  };
  $("ejemplo").addEventListener("click", () => { fallo = false; rellenar(); });
  /* Enviar tarda como en un servicio real: el botón muestra que trabaja y no admite otro clic. */
  form.addEventListener("submit", (e) => {
    e.preventDefault(); if (document.body.classList.contains("bc-ocupado")) return;
    const b = $("enviar"); b.classList.add("bc-busy"); b.setAttribute("aria-busy", "true"); document.body.classList.add("bc-ocupado");
    setTimeout(() => { b.classList.remove("bc-busy"); b.removeAttribute("aria-busy"); enviar(); pista(!$("formWrap").hidden); setTimeout(() => document.body.classList.remove("bc-ocupado"), 60); }, 800);
  });
  function enviar() {
    limpiar();
    const malos = [...form.querySelectorAll("input[required]:not([type=checkbox]),select[required]")].filter((el) => !bien(el));
    malos.forEach((el) => el.closest(".nwt-input-box").classList.add("nwt-input-box--error"));
    const sinArea = !form.querySelector('[name="areas"]:checked'), sinAcepto = !$("acepto").checked, sinRec = !filas().length;
    if (malos.length || sinArea || sinAcepto || sinRec) {
      /* Patrón de demo: el 2.º intento completa lo que falta con ejemplo; el 3.º envía. */
      if (fallo) { rellenar(); fallo = false; return; }
      fallo = true;
      const faltas = [malos.length ? malos.length + " campo" + (malos.length > 1 ? "s" : "") + " obligatorio" + (malos.length > 1 ? "s" : "") : "", sinArea ? "al menos un área de intervención" : "", sinRec ? "al menos un recurso" : "", sinAcepto ? "aceptar las condiciones" : ""].filter(Boolean).join(", ");
      $("error").innerHTML = '<div class="nwt-alert nwt-alert--visible" nwt-theme="negative" nwt-variant="quiet" role="alert"><div class="nwt-alert__content"><span class="nwt-alert__label">Falta: ' + faltas + ".</span></div></div>";
      return;
    }
    $("okEmail").textContent = form.elements.email.value;
    $("okRecs").innerHTML = recsDe().map((r) => '<div class="bc-item"><div class="grow"><div class="t">' + r.nombre.replace(/</g, "&lt;") + '</div><div class="s">' + r.cat + " · " + r.modo + (r.cupo ? " · " + r.cupo.replace(/</g, "&lt;") + " plazas" : "") + "</div></div></div>").join("");
    $("formWrap").hidden = true; $("ok").hidden = false; $("ok").classList.add("bc-entra"); pasos(true); window.scrollTo(0, 0);
  }
  $("otra").addEventListener("click", () => { form.reset(); $("recs").innerHTML = ""; filaRec(); limpiar(); fallo = false; $("formWrap").hidden = false; $("ok").hidden = true; pasos(); });
  /* Pista del patrón de 3 clics para el marco de la demo (fuera de la pantalla). */
  const pista = (on) => { try { parent.postMessage({ type: "demo-pista", clave: on ? "form" : "ok", texto: on ? "Toca «Registrar entidad» dos veces y se rellena solo." : null }, "*"); } catch (e) { /* sin marco */ } };
  pista(true);
  $("otra").addEventListener("click", () => pista(true));
  window.DEMO = { restablecer() { /* sin datos guardados */ } };
})();
</script>
</body>
</html>
