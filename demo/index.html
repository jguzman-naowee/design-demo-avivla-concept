<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brújula Ciudadana · Demo · Naowee</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <a class="zb home" href="../" aria-label="Volver a elegir rol" title="Volver a elegir rol"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <img class="logo" src="../shared/logos/naowee.svg" alt="Naowee" width="106" height="20">
    <span class="sep" aria-hidden="true"></span>
    <div class="ttl"><h1 id="appNombre">Demo móvil</h1><span class="sub" id="appSub">Demo móvil</span></div>
  </div>
  <div class="tools">
    <span class="devtag" id="devtag" hidden>DEV</span>
    <label class="sr" for="appSel">App</label><select id="appSel" class="appsel" hidden></select>
    <div class="supsel" role="group" aria-label="Superficie">
      <button type="button" data-sup="movil" aria-pressed="true"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="6" y="2.5" width="8" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 15h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Móvil</button>
      <button type="button" data-sup="escritorio" aria-pressed="false"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 13.5V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Escritorio</button>
    </div>
    <button type="button" class="pill" id="planaBtn" role="switch" aria-checked="false" title="Mostrar solo la app, sin teléfono (Esc para salir)">
      <span>Vista plana</span><span class="track" aria-hidden="true"><span class="knob"></span></span>
    </button>
    <button type="button" class="pill" id="casosBtn" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Casos</span>
    </button>
  </div>
</header>
<main class="stage" id="stage">
  <section class="device" id="device" aria-label="Diseño">
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" class="zb" id="zOut" aria-label="Alejar" title="Alejar"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9h5M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button type="button" class="zb" id="zIn" aria-label="Acercar" title="Acercar"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 9h5M9 6.5v5M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <div class="scroller" id="scroller">
      <div class="holder" id="holder">
        <div class="phone" id="phone">
          <div class="screen" id="screen">
            <div class="bbar"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><button type="button" class="bback" id="bBack" aria-label="Atrás" title="Atrás">‹</button><span class="url">brujulaciudadana.org</span></div>
            <div class="sbar" id="sbar" aria-hidden="true">
              <span class="clock">9:30</span>
              <span class="isla"></span>
              <span class="ind">
                <svg viewBox="0 0 18 12" width="18" height="12"><path d="M1 9h2.4v2H1zM5.2 6.5h2.4V11H5.2zM9.4 4h2.4v7H9.4zM13.6 1h2.4v10h-2.4z" fill="currentColor"/></svg>
                <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0L8 11.2zM3.7 6.3a6.1 6.1 0 0 1 8.6 0l-1.2 1.3a4.3 4.3 0 0 0-6.2 0L3.7 6.3zM1.3 3.8a9.5 9.5 0 0 1 13.4 0l-1.2 1.3a7.7 7.7 0 0 0-11 0L1.3 3.8z" fill="currentColor"/></svg>
                <svg viewBox="0 0 26 12" width="26" height="12"><rect x=".6" y=".6" width="21.8" height="10.8" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="1.6" fill="currentColor"/><path d="M24 4v4c.8-.3 1.4-1 1.4-2S24.8 4.3 24 4z" fill="currentColor" opacity=".5"/></svg>
              </span>
            </div>
            <div class="vp"><iframe id="app" title="Diseño"></iframe></div>
            <div class="hbar" id="hbar" aria-hidden="true"><span></span></div>
            <div class="pista" id="pista" role="status" hidden><span id="pistaTxt"></span><button type="button" id="pistaX" aria-label="Cerrar">×</button></div>
            <div class="spot" id="spot" hidden></div>
            <div class="cursor" id="cursor" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="Casos">
    <div class="phd">
      <div class="k">CASOS</div>
      <button type="button" class="reset" id="resetDatos" title="Vuelve a los datos de ejemplo del inicio">↺ Restablecer datos</button>
      <button type="button" class="zb" id="closePanel" aria-label="Cerrar el panel de casos"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <ol class="cases" id="cases"></ol>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="ctrl">
      <div class="cnt" id="cnt" role="progressbar" aria-label="Avance del caso"></div>
      <div class="seg" role="group" aria-label="Modo">
        <button type="button" data-mode="paso" class="on">Paso a paso</button>
        <button type="button" data-mode="auto" class="ic" aria-label="Automático" title="Automático"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg></button>
      </div>
      <button type="button" class="btn ghost ic" id="restart" aria-label="Reiniciar el caso" title="Reiniciar el caso">↺</button>
      <button type="button" class="btn ghost ic" id="stop" aria-label="Detener la ejecución" title="Detener la ejecución" disabled>■</button>
      <button type="button" class="btn" id="next">Siguiente ▸</button>
    </div>
    <section class="dev" id="dev" hidden aria-label="Modo dev">
      <div class="k">MODO DEV</div>
      <div class="row">
        <label class="sr" for="size">Tamaño del teléfono</label>
        <select id="size" class="appsel">
          <option value="375x667">iPhone SE · 375×667</option>
          <option value="390x844" selected>iPhone 15 · 390×844</option>
          <option value="412x915">Pixel 8 · 412×915</option>
        </select>
        <button type="button" class="btn ghost" id="reload">⟳ Recargar app</button>
      </div>
      <div class="row">
        <button type="button" class="btn ghost" id="pickBtn" aria-pressed="false">◎ Elegir elemento</button>
      </div>
      <label class="k" for="log">PASOS CAPTURADOS (se copian al portapapeles)</label>
      <textarea id="log" rows="6" spellcheck="false" placeholder="Activa «Elegir elemento» y pulsa algo en el teléfono."></textarea>
    </section>
  </aside>
</main>
<script src="apps/index.js"></script>
<script src="demo.js"></script>
</body>
</html>
